# Render blueprint. Two services, because the merchant is an untrusted third party
# and the demo is less honest if it shares a process with the gateway that refuses
# its baskets.
#
# Free instance type, deliberately, and the cost of that is written down here rather
# than discovered after a deploy.
#
# Render's free plan has no persistent disk. The ledger and the hold database live in
# the container filesystem, so **both are lost on every deploy and on every spin-down**
# -- and free services spin down after about 15 minutes of inactivity, which a judge
# arriving cold will hit as a ~50s first request.
#
# MANDATE_LEDGER_KEY is generated per instance, so it is regenerated along with the
# container. Records written before a restart will then report as signed by an unknown
# key. That is the ledger telling the truth: it genuinely cannot verify them, and the
# key id is written outside the signature precisely so a record cannot nominate a key
# into existence. It is not a bug to be explained away on the demo URL.
#
# This is the opposite of what an append-only audit log is for. It is the right
# trade for a hosted demo that must cost nothing, and the wrong one for anything else:
# to make the ledger durable, set `plan: starter` on the gateway and restore the disk
# block shown at the bottom of this file.
#
# After a restart, repopulate in one command:
#   render shell mandate-gateway -> python scripts/seed_demo.py
# or just hit the dashboard; an empty ledger renders as an empty table, not an error.

services:
  - type: web
    name: mandate-merchant
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /merchants
    dockerCommand: sh -c "exec uvicorn mandate.merchant.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      # The same value the gateway holds. `fromService` rather than two copies of
      # a generated secret, because a merchant and a gateway that disagree about
      # the signing key fail with "signature invalid" on every quote, which reads
      # like an attack rather than a configuration mistake.
      - key: MANDATE_MERCHANT_SECRET
        fromService:
          name: mandate-gateway
          type: web
          envVarKey: MANDATE_MERCHANT_SECRET

  - type: web
    name: mandate-gateway
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    # No `disk:` block -- the free plan cannot attach one. See the note at the top.
    envVars:
      - key: MANDATE_VAR_DIR
        value: /var/lib/mandate
      # Generated once by Render and then never changed by it. Rotating this means
      # moving the old value into MANDATE_LEDGER_RETIRED_KEYS, not replacing it:
      # an append-only ledger outlives its key, and re-signing the past would mean
      # rewriting it.
      - key: MANDATE_LEDGER_KEY
        generateValue: true
      - key: MANDATE_MERCHANT_SECRET
        generateValue: true
      - key: MANDATE_LEDGER_RETIRED_KEYS
        value: ""
      - key: MANDATE_MERCHANT_URL
        fromService:
          name: mandate-merchant
          type: web
          property: hostport
      # Set this to the gateway's own URL after the first deploy. It is what the
      # approval link points at and where PayPal returns the buyer, so a wrong
      # value produces links that resolve to localhost on the approver's phone.
      - key: MANDATE_PUBLIC_URL
        sync: false
      # Every one of these is entered in the Render dashboard, not here. sync:false
      # means "this blueprint does not carry the value", which is the only correct
      # way to describe a credential in a file that is committed.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: MANDATE_APPROVER_NUMBER
        sync: false

# To make the ledger survive deploys, set `plan: starter` on mandate-gateway and add
# this back under it. ~$7/mo for the instance; the disk itself is included at this
# size. Nothing else in this file changes.
#
#     disk:
#       name: ledger
#       mountPath: /var/lib/mandate
#       sizeGB: 1
