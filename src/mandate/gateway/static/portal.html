<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mandate</title>
<style>
:root{color-scheme:dark;--bg:#0b0d10;--panel:#11151b;--line:#1b212b;--fg:#e6e9ef;--dim:#8b93a3;
  --accent:#7aa2f7;--allow:#9ece6a;--deny:#f7768e;--hold:#e0af68}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);padding:22px 16px 72px;
  font:15px/1.6 ui-sans-serif,system-ui,-apple-system,sans-serif}
main{max-width:860px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:21px;margin:0}
h2{font-size:15px;margin:30px 0 10px}
.sub{color:var(--dim);font-size:13px;margin:2px 0 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
textarea,input{width:100%;background:#0b0d10;color:var(--fg);border:1px solid var(--line);
  border-radius:7px;padding:10px 11px;font:inherit}
textarea{min-height:76px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--accent)}
button{background:var(--accent);color:#06080c;border:0;border-radius:7px;padding:9px 16px;
  font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
button.small{padding:6px 12px;font-size:13px}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.opt{border:1px solid var(--line);border-radius:9px;padding:13px;margin-top:9px;background:#0d1117}
.opt .name{font-weight:600}
.opt .price{color:var(--allow);font-variant-numeric:tabular-nums}
.why{color:var(--dim);font-size:13px;margin:5px 0 0}
.desc{color:var(--dim);font-size:12px;margin:4px 0 0}
table{width:100%;border-collapse:collapse}
td,th{padding:8px;border-top:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}
th{color:var(--dim);font-weight:500;border-top:0}
.tag{border-radius:999px;padding:2px 10px;font-size:11px;white-space:nowrap}
.t-ok{background:#122113;color:var(--allow)}
.t-no{background:#2a0f16;color:var(--deny)}
.t-wait{background:#2a220f;color:var(--hold)}
.t-dim{background:#15191f;color:var(--dim)}
.msg{border-radius:8px;padding:12px 14px;margin-top:11px;font-size:13px;display:none}
.msg.on{display:block}
.msg.good{background:#122113;border:1px solid var(--allow)}
.msg.bad{background:#2a0f16;border:1px solid var(--deny)}
.msg.wait{background:#2a220f;border:1px solid var(--hold)}
.msg ul{margin:7px 0 0;padding-left:18px;color:var(--dim)}
.empty{color:var(--dim);font-size:13px;padding:10px 0}
.how{color:var(--dim);font-size:12px;margin-top:9px;font-style:italic}
a{color:var(--accent)}
.amount{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>What do you need?</h1>
      <p class="sub">Describe it. Options come back before anything is bought.</p>
    </div>
    <div class="row">
      <span id="who" class="tag t-dim"></span>
      <a id="adminLink" href="/v1/ops/admin" style="display:none;font-size:13px">Admin console</a>
      <button class="ghost small" onclick="signOut()">Sign out</button>
    </div>
  </header>

  <div class="panel" style="margin-top:18px">
    <textarea id="need" placeholder="I want a dress for my office party. My height is 160 cm."></textarea>
    <div class="row" style="margin-top:10px">
      <button id="ask" onclick="ask()">Show me options</button>
      <span class="sub">Nothing is bought until you pick one.</span>
    </div>
    <div id="options"></div>
    <div id="how" class="how"></div>
    <div id="result" class="msg"></div>
  </div>

  <h2 id="approvalsHead" style="display:none">Waiting for your approval</h2>
  <div id="approvalsPanel" class="panel" style="display:none"></div>

  <h2>Your requests</h2>
  <div class="panel"><table id="requests"></table></div>
</main>

<script>
let me = null;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function boot() {
  const r = await fetch('/app/me');
  if (!r.ok) { location.href = '/login?next=/app'; return; }
  me = await r.json();
  document.getElementById('who').textContent = me.username + ' · ' + me.role;
  if (me.can_approve) document.getElementById('adminLink').style.display = '';
  loadRequests();
  loadApprovals();
}

async function signOut() {
  await fetch('/app/logout', { method: 'POST' });
  location.href = '/login';
}

// -- asking ---------------------------------------------------------------

async function ask() {
  const need = document.getElementById('need').value.trim();
  if (need.length < 3) return;
  const btn = document.getElementById('ask');
  btn.disabled = true; btn.textContent = 'Looking…';
  document.getElementById('result').className = 'msg';
  document.getElementById('options').innerHTML = '';
  document.getElementById('how').textContent = '';
  try {
    const r = await fetch('/app/shortlist', {
      method: 'POST', headers: {'content-type':'application/json'},
      body: JSON.stringify({ need })
    });
    const body = await r.json();
    if (!r.ok) { show('bad', body.detail || 'That did not work.'); return; }
    if (!body.options.length) { document.getElementById('how').textContent = 'Nothing matched.'; return; }
    document.getElementById('options').innerHTML = body.options.map(o => `
      <div class="opt">
        <div class="row" style="justify-content:space-between">
          <span class="name">${esc(o.name)}</span>
          <span class="price amount">${esc(o.price)} ${esc(o.currency)}</span>
        </div>
        ${o.why ? `<p class="why">${esc(o.why)}</p>` : ''}
        <p class="desc">${esc(o.description)}</p>
        <div class="row" style="margin-top:9px">
          <button class="small" onclick="buy('${esc(o.sku)}','${esc(o.merchant_id)}')">Request this</button>
          <span class="sub">${esc(o.merchant_name)}</span>
        </div>
      </div>`).join('');
    document.getElementById('how').textContent = body.how;
  } finally {
    btn.disabled = false; btn.textContent = 'Show me options';
  }
}

async function buy(sku, merchant_id) {
  const need = document.getElementById('need').value.trim();
  const r = await fetch('/app/buy', {
    method: 'POST', headers: {'content-type':'application/json'},
    body: JSON.stringify({ sku, merchant_id, need })
  });
  const body = await r.json();
  if (!r.ok) { show('bad', body.detail || 'That did not work.'); loadRequests(); return; }

  const denied = (body.rule_trace || []).filter(x => x.outcome === 'deny');
  if (body.outcome === 'allow') {
    show('good', body.status + '.' + (body.buyer_approval_url
      ? ` <a href="${esc(body.buyer_approval_url)}" target="_blank" rel="noopener">Confirm at PayPal →</a>` : ''));
  } else if (body.outcome === 'hold_for_approval') {
    show('wait', 'Sent for approval. No money is reserved until someone says yes.');
  } else {
    show('bad', 'Refused. Nothing was charged.',
      denied.map(d => d.message));
  }
  loadRequests();
  loadApprovals();
}

function show(kind, html, items) {
  const box = document.getElementById('result');
  box.className = 'msg on ' + kind;
  box.innerHTML = html + (items && items.length
    ? '<ul>' + items.map(i => '<li>' + esc(i) + '</li>').join('') + '</ul>' : '');
}

// -- history --------------------------------------------------------------

const TAG = { Refused:'t-no', Declined:'t-no', 'Could not complete':'t-no',
  'Waiting for approval':'t-wait', 'Ready to pay':'t-wait', 'Being checked':'t-dim',
  Paid:'t-ok', 'Money held':'t-ok', Released:'t-dim', Refunded:'t-dim', Expired:'t-dim' };

async function loadRequests() {
  const r = await fetch('/app/requests').then(x => x.json());
  document.getElementById('requests').innerHTML =
    '<tr><th>When</th><th>What you asked for</th><th>Amount</th><th>Status</th></tr>' +
    (r.requests.length ? r.requests.map(q => `<tr>
      <td class="sub">${esc(q.requested_at.slice(0,16).replace('T',' '))}</td>
      <td>${esc(q.asked_for) || '<span class="sub">—</span>'}
          <div class="sub">${esc(q.merchant_name)}</div></td>
      <td class="amount">${esc(q.amount)} ${esc(q.currency)}</td>
      <td><span class="tag ${TAG[q.status[0]] || 't-dim'}">${esc(q.status[0])}</span>
          <div class="sub">${esc(q.status[1])}</div></td>
    </tr>`).join('') : '<tr><td colspan="4" class="empty">Nothing yet.</td></tr>');
}

async function loadApprovals() {
  const r = await fetch('/app/approvals').then(x => x.json());
  if (!r.can_approve || !r.approvals.length) {
    document.getElementById('approvalsHead').style.display = 'none';
    document.getElementById('approvalsPanel').style.display = 'none';
    return;
  }
  document.getElementById('approvalsHead').style.display = '';
  const panel = document.getElementById('approvalsPanel');
  panel.style.display = '';
  panel.innerHTML = r.approvals.map(a => `
    <div class="opt" style="margin-top:0">
      <div class="row" style="justify-content:space-between">
        <span class="name amount">${esc(a.amount)} ${esc(a.currency)}
          <span class="sub">at ${esc(a.merchant_name)}</span></span>
        ${a.mine ? '<span class="tag t-wait">your own request</span>' : ''}
      </div>
      ${a.agent_reason ? `<p class="why">“${esc(a.agent_reason)}”</p>` : ''}
      <div class="row" style="margin-top:9px">
        <button class="small" onclick="decide('${esc(a.decision_id)}','approve')">Approve</button>
        <button class="small ghost" onclick="decide('${esc(a.decision_id)}','decline')">Decline</button>
      </div>
    </div>`).join('');
}

async function decide(id, what) {
  const r = await fetch(`/v1/ops/approvals/${id}/${what}`, {
    method: 'POST', headers: {'content-type':'application/json'},
    body: JSON.stringify({ approver: me.username })
  });
  if (!r.ok) { const b = await r.json().catch(()=>({})); alert(b.detail || 'that did not work'); }
  loadApprovals(); loadRequests();
}

boot();
setInterval(() => { loadApprovals(); loadRequests(); }, 8000);
</script>
</body>
</html>
