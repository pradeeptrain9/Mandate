[project]
name = "mandate"
version = "0.1.0"
description = "A spend firewall and conditional-authorization rail for AI agents, on PayPal"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "fastapi>=0.115",
  # The human approval page posts a plain HTML form, which Starlette can only
  # parse with this installed. Not optional: the approval flow is the form.
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30",
  "anthropic>=0.70",
  "python-dotenv>=1.0",
  # Mandate exposes itself as an MCP server so a third-party agent (Claude
  # Desktop, Claude Code) can be governed by it. 2.x renamed FastMCP -> MCPServer.
  "mcp>=2.0",
  # Used for merchant-side PayPal work only -- invoices, disputes, tracking,
  # reporting. The hold lifecycle speaks raw REST because the toolkit does not
  # expose authorize/void/reauthorize.
  "paypal-agent-toolkit>=1.11",
]

[project.optional-dependencies]
# pytest-asyncio is not optional: `asyncio_mode = "auto"` below is what lets the
# async tests run without a marker on every one of them, and without the plugin
# `--strict-markers` turns that setting into a collection error. Found by cloning
# this repository into an empty directory and following the README, which is the
# only way that class of bug ever surfaces -- it passed locally for weeks because
# the plugin was installed by hand.
dev = ["pytest>=8.0", "pytest-asyncio>=1.0", "hypothesis>=6.100"]

[project.scripts]
mandate = "mandate.cli:main"
mandate-mcp = "mandate.gateway.mcp_server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The dashboard is an .html file inside the package, so it has to be declared or a
# wheel installs without it and /v1/ops/dashboard 500s only after deployment --
# which is the worst moment to find out.
[tool.setuptools.package-data]
mandate = ["gateway/static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q --strict-markers"

asyncio_mode = "auto"

# Pinned rather than left to ruff's defaults, which move between releases: a lint
# commit nobody can reproduce is worse than no lint commit.
[tool.ruff]
# 110, not 88 or 100: measured against what is already here (p50 34, p95 83,
# p99 95). A lower ceiling would reflow ~65 lines of working code for no reading
# benefit, and this still catches the genuine outliers.
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# BLE is selected on purpose. Every broad `except Exception` here is deliberate --
# a progress line must not fail a run, an oracle must not stop a sweep, reporting a
# failed SMS must not fail the decision -- and each carries a `# noqa: BLE001`
# saying which. Leaving the rule out turned those into unused-noqa, and the autofix
# stripped the reasons along with them.
select = ["E", "F", "I", "UP", "B", "BLE", "DTZ", "RUF", "S", "TRY", "PYI"]
ignore = [
  # FastAPI's whole dependency-injection idiom is `x = Depends(...)` in a default
  # argument. Obeying B008 here would mean rewriting every route signature to
  # work around a rule written for mutable defaults.
  "B008",
  # Asserts are the point in a test suite.
  "S101",
  # `raise ... from exc` is already used where the cause matters; TRY003's ban on
  # messages at the raise site would push every error string into a subclass.
  "TRY003",
  # The terminal output uses typographic characters on purpose -- `2×SKU-PAPER`
  # and en dashes read better than ASCII in a demo someone watches.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests name what they do rather than what they return, and reach into internals
# on purpose.
# S105-S107: test fixtures carry credentials, and they are credentials for an
# in-memory database that exists for the length of one test.
"tests/*" = ["S105", "S106", "S107", "TRY"]

[tool.ruff.lint.isort]
known-first-party = ["mandate"]
# pytest puts tests/ on sys.path, so these are local modules, not third-party.
# Without this they sort above `mandate` imports, which reads as though the test
# helpers were a dependency.
known-local-folder = ["fake_backend", "fake_paypal", "helpers"]
